<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afton Robotics, LLC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: url('images/background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .custom-card {
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            padding: 40px;
            margin-top: 100px;
            color: #ffffff;
        }

        /* Large style formatting for form inputs */
        .extra-large-input {
            padding: 14px 18px;
            font-size: 1.15rem;
            border-radius: 8px;
            width: 100%;
        }

        .extra-large-label {
            font-size: 1.3rem;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Header Section from your original file -->
    <header>
        <nav class="navbar navbar-expand-sm bg-secondary navbar-light fixed-top">
            <div class="container-fluid">
                <img src="images/Bad-Robot-Productions-Logo.png" alt="Avatar Logo" style="width:40px;"
                    class="rounded-pill">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item"> <a class="nav-link" href="index.html">Home</a> </li>
                        <li class="nav-item"> <a class="nav-link" href="index.html#products-section">Products</a> </li>
                        <li class="nav-item"> <a class="nav-link active" aria-current="page" href="about.html">About</a>
                        </li>
                        <li class="nav-item"> <a class="nav-link active" aria-current="page"
                                href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- FIXED: Restored opening main element wrapper and set form card to a clean balanced width -->
    <main class="main-content container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="custom-card col-11 col-sm-10 col-md-9 col-lg-8 col-xl-7 shadow-lg">

                <!-- Integrated Form System -->
                <form class="mt-2">
                    <h3 class="text-warning mb-4 text-start border-bottom border-secondary pb-2">Send us a Message</h3>

                    <!-- Center column wrapper for name, email, and subject fields -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="mb-3">
                                <input type="text" class="form-control extra-large-input" name="fullName"
                                    placeholder="Full Name">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control extra-large-input" name="email"
                                    placeholder="Email Address">
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control extra-large-input" name="subject"
                                    placeholder="Subject">
                            </div>
                        </div>
                    </div>

                    <!-- Message text area spans the complete horizontal width of the card layout -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <label for="comment" class="extra-large-label fw-bold text-light">Message</label>
                            <textarea class="form-control extra-large-input" rows="12" id="comment" name="Text"
                                placeholder="Write your wide message here..."></textarea>
                        </div>
                    </div>

                    <!-- Form submit execution button -->
                    <div class="row">
                        <div class="col-12">
                            <button type="submit"
                                class="btn btn-warning btn-lg w-100 py-3 fw-bold fs-4 text-dark">Submit Message</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- Fixed, High-Contrast Footer from your original file -->
    <footer class="bg-dark text-white py-4 mt-auto border-top border-secondary"
        style="position: relative; z-index: 10;">
        <div class="container">
            <div class="row align-items-center text-center text-md-start">

                <!-- Left Side: Copyright & Clear Light Gray Legal Links -->
                <div class="col-md-6 mb-3 mb-md-0">
                    <p class="mb-1 text-white fw-bold">2026 Afton Robotics, LLC. All rights reserved.</p>
                    <small>
                        <a href="/privacy" class="text-light text-decoration-underline me-3 opacity-75">Privacy
                            Policy</a>
                        <a href="/terms" class="text-light text-decoration-underline opacity-75">Terms of Service</a>
                    </small>
                </div>

                <!-- Right Side: Contact Channels (Bright text colors) -->
                <div class="col-md-6 text-md-end text-light small">
                    <p class="mb-1 text-white">
                        <span class="text-danger me-1">📍</span>Session Road, Baguio City, 2600 Benguet
                    </p>
                    <p class="mb-0">
                        <span class="text-info me-1">📧</span><a href="mailto:banaylanz8@gmail.com"
                            class="text-light text-decoration-none">banaylanz8@gmail.com</a>
                        <span class="text-muted mx-2">|</span>
                        <span class="text-success me-1">📞</span><a href="tel:+639158462526"
                            class="text-light text-decoration-none">+63 915 846 2526</a>
                    </p>
                </div>

            </div>
        </div>
    </footer>

</body>

</html>
